# Hosting build specification only. No Amplify app/branch/domain is connected by this file.
version: 1
applications:
  - appRoot: apps/storefront
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci
        build:
          commands:
            - NEXT_TELEMETRY_DISABLED=1 SONORAN_STAGE=scaffold npm run build
      artifacts:
        baseDirectory: apps/storefront/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/storefront/.next/cache/**/*
