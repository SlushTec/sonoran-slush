name: Verify native storefront
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preservation-and-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/verify_archive.py
      - run: python scripts/check_links.py
      - run: python -m scripts.export_contracts --check
      - run: python -m pytest -q
      - run: git diff --exit-code
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SONORAN_STAGE: scaffold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run test:frontend
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  terraform-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.15.5'
      - run: terraform fmt -check -recursive infra/terraform
      - run: |
          for environment in dev staging production; do
            terraform -chdir=infra/terraform/environments/$environment init -backend=false
            terraform -chdir=infra/terraform/environments/$environment validate
          done
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:8187/health
          curl --fail http://127.0.0.1:8188/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8187/ready)" = 503
      - if: always()
        run: docker compose logs --no-color && docker compose down
